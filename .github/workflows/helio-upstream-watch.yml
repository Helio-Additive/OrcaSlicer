name: Helio Upstream Watch

on:
  schedule:
    - cron: '0 9 * * 4'  # Thursday 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.HELIO_RELEASE_BRANCH || 'orca-latest-parity-bambu' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/SoftFever/OrcaSlicer.git || true
          git fetch upstream --tags --force
          git fetch upstream 'refs/heads/release/*:refs/remotes/upstream/release/*' || true
          git fetch upstream main || true

      - name: Generate digest
        id: digest
        run: |
          RELEASE_BRANCH="${{ vars.HELIO_RELEASE_BRANCH || 'orca-latest-parity-bambu' }}"

          # Find last-synced baseline
          if git rev-parse "helio-last-synced" >/dev/null 2>&1; then
            BASELINE_COMMIT=$(git rev-parse "helio-last-synced")
            BASELINE_TAG=$(git tag -l 'v*' --points-at "$BASELINE_COMMIT" | head -1)
            if [ -z "$BASELINE_TAG" ]; then
              BASELINE_TAG="helio-last-synced"
            fi
          else
            BASELINE_TAG="v2.3.2-rc2"
          fi

          # New tags since baseline
          NEW_TAGS=$(git tag -l 'v*' --sort=-version:refname | while read tag; do
            if git merge-base --is-ancestor "$BASELINE_TAG" "$tag" 2>/dev/null && [ "$tag" != "$BASELINE_TAG" ]; then
              COMMIT_DATE=$(git log -1 --format='%ci' "$tag" | cut -d' ' -f1)
              echo "- \`$tag\` ($COMMIT_DATE)"
            fi
          done)

          if [ -z "$NEW_TAGS" ]; then
            NEW_TAGS="None"
          fi

          # Commits on main since last release (exclude prereleases — git's
          # version:refname sort ranks e.g. v2.3.2-rc2 above v2.3.2 otherwise).
          # `|| true` keeps pipefail happy when grep finds nothing.
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname \
            | grep -Evi -- '-(alpha|beta|rc|pre|dev)([.-]?[0-9A-Za-z]+)?$' \
            | head -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No stable upstream release tags found" >&2
            exit 1
          fi
          MAIN_COMMITS=$(git rev-list --count "$LATEST_TAG"..upstream/main 2>/dev/null || echo "unknown")

          # Active release branches
          RELEASE_BRANCHES=$(git branch -r --list 'upstream/release/*' | while read branch; do
            CLEAN_BRANCH=$(echo "$branch" | xargs)
            COMMITS_AHEAD=$(git rev-list --count "$LATEST_TAG".."$CLEAN_BRANCH" 2>/dev/null || echo "?")
            echo "- \`$CLEAN_BRANCH\`: $COMMITS_AHEAD commits ahead of \`$LATEST_TAG\`"
          done)

          if [ -z "$RELEASE_BRANCHES" ]; then
            RELEASE_BRANCHES="None"
          fi

          # Helio-relevant file changes on main
          WATCHED_FILES=(
            "src/slic3r/GUI/Plater.cpp"
            "src/slic3r/GUI/Plater.hpp"
            "src/slic3r/GUI/MainFrame.cpp"
            "src/slic3r/GUI/MainFrame.hpp"
            "src/slic3r/GUI/GCodeViewer.cpp"
            "src/slic3r/GUI/NotificationManager.cpp"
            "src/slic3r/GUI/NotificationManager.hpp"
            "src/slic3r/GUI/PartPlate.hpp"
            "src/slic3r/GUI/PartPlate.cpp"
            "src/slic3r/GUI/GUI_App.cpp"
            "src/slic3r/GUI/GUI_App.hpp"
            "src/slic3r/GUI/Preferences.cpp"
            "src/slic3r/GUI/BackgroundSlicingProcess.hpp"
            "src/slic3r/GUI/Widgets/SwitchButton.cpp"
            "src/slic3r/GUI/Widgets/SwitchButton.hpp"
            "src/slic3r/GUI/Widgets/TextInput.cpp"
            "src/slic3r/GUI/Widgets/TextInput.hpp"
            "src/slic3r/GUI/LibVGCode/LibVGCodeWrapper.cpp"
            "src/slic3r/CMakeLists.txt"
            "src/libslic3r/AppConfig.cpp"
            "src/libslic3r/PrintBase.hpp"
            "src/libslic3r/GCode/GCodeProcessor.cpp"
            "src/libslic3r/GCode/GCodeProcessor.hpp"
            "src/libvgcode/include/PathVertex.hpp"
            "src/libvgcode/include/Types.hpp"
            "src/libvgcode/src/ViewerImpl.cpp"
            "src/libvgcode/src/ViewerImpl.hpp"
          )

          MAIN_CHANGES=""
          for f in "${WATCHED_FILES[@]}"; do
            STAT=$(git diff --stat "$LATEST_TAG"..upstream/main -- "$f" 2>/dev/null | tail -1)
            if [ -n "$STAT" ] && echo "$STAT" | grep -q "changed"; then
              printf -v MAIN_CHANGES '%s- `%s`: %s\n' "$MAIN_CHANGES" "$f" "$STAT"
            fi
          done

          if [ -z "$MAIN_CHANGES" ]; then
            MAIN_CHANGES="No Helio-relevant files changed on main since \`$LATEST_TAG\`."
          fi

          # Check release branches for helio-relevant changes
          BRANCH_CHANGES=""
          for branch in $(git branch -r --list 'upstream/release/*' | xargs); do
            BRANCH_REPORT=""
            for f in "${WATCHED_FILES[@]}"; do
              STAT=$(git diff --stat "$LATEST_TAG".."$branch" -- "$f" 2>/dev/null | tail -1)
              if [ -n "$STAT" ] && echo "$STAT" | grep -q "changed"; then
                printf -v BRANCH_REPORT '%s  - `%s`: %s\n' "$BRANCH_REPORT" "$f" "$STAT"
              fi
            done
            if [ -n "$BRANCH_REPORT" ]; then
              BRANCH_CHANGES="${BRANCH_CHANGES}$(printf '\n**%s:**\n%s' "$branch" "$BRANCH_REPORT")"
            fi
          done

          if [ -z "$BRANCH_CHANGES" ]; then
            BRANCH_CHANGES="No Helio-relevant files changed on release branches."
          fi

          # Build the full digest — write directly to GITHUB_OUTPUT
          {
            echo "digest<<DIGEST_DELIM"
            echo "## Upstream Activity Digest — $(date '+%Y-%m-%d')"
            echo ""
            echo "**Helio release branch:** \`$RELEASE_BRANCH\`"
            echo "**Last synced to:** \`$BASELINE_TAG\`"
            echo "**Latest upstream tag:** \`$LATEST_TAG\`"
            echo ""
            echo "### New Tags Since Last Sync"
            echo "$NEW_TAGS"
            echo ""
            echo "### Main Branch Activity"
            echo "$MAIN_COMMITS commits on \`main\` since \`$LATEST_TAG\`"
            echo ""
            echo "### Active Release Branches"
            echo "$RELEASE_BRANCHES"
            echo ""
            echo "### Helio-Relevant File Changes (main)"
            echo "$MAIN_CHANGES"
            echo ""
            echo "### Helio-Relevant File Changes (release branches)"
            echo "$BRANCH_CHANGES"
            echo ""
            echo "---"
            echo "*Auto-generated by helio-upstream-watch workflow*"
            echo "DIGEST_DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Find or create watch issue
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream-watch',
              state: 'open',
              per_page: 1
            });

            if (issues.length > 0) {
              core.setOutput('number', issues[0].number);
              console.log(`Found existing watch issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream Activity Watch',
                labels: ['upstream-watch'],
                body: 'This issue tracks upstream OrcaSlicer activity relevant to the Helio integration. Updated weekly by the helio-upstream-watch workflow.'
              });
              core.setOutput('number', issue.number);
              console.log(`Created new watch issue #${issue.number}`);
            }

      - name: Post digest as comment
        uses: actions/github-script@v7
        with:
          script: |
            const digest = process.env.DIGEST;
            if (!digest || !digest.trim()) {
              core.setFailed('DIGEST env var is missing or empty');
              return;
            }
            const issueNumberRaw = process.env.ISSUE_NUMBER;
            if (!issueNumberRaw || !/^\d+$/.test(issueNumberRaw)) {
              core.setFailed(`ISSUE_NUMBER is missing or invalid: "${issueNumberRaw ?? ''}"`);
              return;
            }
            const issueNumber = parseInt(issueNumberRaw, 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: digest
            });
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
