name: Sync PR hygiene

# Defense-in-depth for the upstream-sync notification problem. The sync workflow
# now squashes the branch before opening the PR, but a hand-made or mis-built sync
# PR could still carry upstream's individual commits. GitHub auto-subscribes the
# author of every commit in a PR to that PR's thread, so an un-squashed sync PR
# subscribes ~100+ external upstream contributors and emails them on every comment.
# This check fails such a PR so it gets squashed first. See CLAUDE.md → Upstream Sync.

on:
  pull_request:
    # `labeled` is required so the upstream-sync-label gate below is re-evaluated
    # when a maintainer adds the label after opening (the default types are only
    # opened/synchronize/reopened).
    types: [opened, synchronize, reopened, labeled]
    branches:
      - orca-latest-parity-bambu

permissions:
  contents: read

jobs:
  require-squashed-sync:
    runs-on: ubuntu-latest
    # Only guard upstream-sync PRs: automated sync branches or the upstream-sync label.
    if: >-
      startsWith(github.head_ref, 'helio-release-candidate-') ||
      startsWith(github.head_ref, 'helio-upstream-') ||
      contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    steps:
      - name: Require the sync branch to be squashed
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          echo "Commits in this sync PR: ${COMMITS:-unknown}"
          # Policy: a sync PR must be exactly ONE internally-authored squashed commit
          # (see the squash-before-PR step in helio-upstream-sync.yml). Anything more
          # means upstream's individual commits are still present — even a small weekly
          # `main` sync of 2-20 commits subscribes those authors to this PR. Require 1.
          if [ "${COMMITS:-0}" -ne 1 ]; then
            echo "::error::This upstream-sync PR has ${COMMITS} commits — a sync PR must be a single squashed, internally-authored commit, or it subscribes the upstream commit authors to this PR's notifications. Squash the sync branch before opening: git commit-tree <merge-tree> -p <target-tip>. See CLAUDE.md → Upstream Sync."
            exit 1
          fi
          echo "Sync PR is a single squashed commit ✓"
