name: Helio Release

# Uses pull_request (not pull_request_target) because all PRs originate from
# branches within the same repo, so secrets and write permissions are available.
# This also ensures reusable workflows check out the correct merge commit.
on:
  pull_request:
    types: [closed]
    branches:
      - orca-latest-parity-bambu

  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Optional tag name (default: helio-v{version})'
        type: string
        required: false
        default: ''

concurrency:
  group: helio-release-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Gate: for PR triggers, only run when a labeled, same-repo PR is actually merged
  # For workflow_dispatch, only run on the release branch
  check:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/orca-latest-parity-bambu') || (
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'release') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version from version.inc
        id: ver
        run: |
          set -euo pipefail
          ver_line=$(grep 'set(SoftFever_VERSION' version.inc || true)
          if [ -z "$ver_line" ]; then
            echo "Error: Could not find SoftFever_VERSION in version.inc" >&2
            exit 1
          fi
          ver=$(printf '%s\n' "$ver_line" | cut -d '"' -f2)
          if [ -z "$ver" ]; then
            echo "Error: Extracted empty version from version.inc" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Determine release tag
        id: tag
        env:
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -euo pipefail
          # Use override if provided, otherwise auto-generate
          if [ -n "$TAG_OVERRIDE" ]; then
            # Validate using Git's own ref rules
            if ! git check-ref-format --allow-onelevel "refs/tags/$TAG_OVERRIDE"; then
              echo "Error: tag_override is not a valid Git tag name" >&2
              exit 1
            fi
            tag="$TAG_OVERRIDE"
          else
            tag="helio-v${{ steps.ver.outputs.version }}"
          fi
          # If tag already exists, append short SHA to avoid collision
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag$"; then
            sha="${{ github.event.pull_request.merge_commit_sha || github.sha }}"
            tag="${tag}-$(echo $sha | cut -c1-7)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build_linux:
    needs: check
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
    secrets: inherit

  build_windows:
    needs: check
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
    secrets: inherit

  build_macos_arch:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-14
      arch: ${{ matrix.arch }}
    secrets: inherit

  build_macos_universal:
    needs: [check, build_macos_arch]
    uses: ./.github/workflows/build_orca.yml
    with:
      os: macos-14
      arch: universal
      macos-combine-only: true
    secrets: inherit

  release:
    needs: [check, build_linux, build_windows, build_macos_universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Prepare release body
        id: body
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
        run: |
          delim="HELIO_EOF_$(openssl rand -hex 8)"
          {
            echo "content<<$delim"
            echo "## OrcaSlicer with Helio Additive — v${{ needs.check.outputs.version }}"
            echo ""
            if [ -n "$PR_NUMBER" ]; then
              echo "Released from PR #${PR_NUMBER}: ${PR_TITLE}"
            else
              echo "Manual release from branch ${{ github.ref_name }}"
            fi
            echo ""
            echo "$PR_BODY"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          missing=""

          # macOS universal DMG
          dmg=$(find artifacts -name 'OrcaSlicer_Mac_universal_*.dmg' -print -quit)
          if [ -n "$dmg" ]; then
            cp "$dmg" "release/OrcaSlicer_Helio_Mac_universal_${{ needs.check.outputs.version }}.dmg"
          else
            missing="$missing macOS-DMG"
          fi

          # Windows installer
          installer=$(find artifacts -name 'OrcaSlicer_Windows_Installer_*.exe' -print -quit)
          if [ -n "$installer" ]; then
            cp "$installer" "release/OrcaSlicer_Helio_Windows_Installer_${{ needs.check.outputs.version }}.exe"
          else
            missing="$missing Windows-Installer"
          fi

          # Windows portable — the artifact is a directory, re-zip it
          portable_dir=$(find artifacts -maxdepth 1 -type d -name 'OrcaSlicer_Windows_*_portable' -print -quit)
          if [ -n "$portable_dir" ]; then
            (cd "$portable_dir" && zip -r "$GITHUB_WORKSPACE/release/OrcaSlicer_Helio_Windows_${{ needs.check.outputs.version }}_portable.zip" .)
          else
            missing="$missing Windows-Portable"
          fi

          # Linux AppImage
          appimage=$(find artifacts -name 'OrcaSlicer_Linux_AppImage*.AppImage' -print -quit)
          if [ -n "$appimage" ]; then
            cp "$appimage" "release/OrcaSlicer_Helio_Linux_${{ needs.check.outputs.version }}.AppImage"
          else
            missing="$missing Linux-AppImage"
          fi

          if [ -n "$missing" ]; then
            echo "Error: Missing release assets:$missing"
            exit 1
          fi

          echo "Release assets:"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: "Helio v${{ needs.check.outputs.version }}"
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          body: ${{ steps.body.outputs.content }}
          files: release/*
          draft: false
          prerelease: >-
            ${{
              contains(needs.check.outputs.version, 'rc') ||
              contains(needs.check.outputs.version, 'RC') ||
              contains(needs.check.outputs.version, 'beta') ||
              contains(needs.check.outputs.version, 'Beta')
            }}
          generate_release_notes: false
