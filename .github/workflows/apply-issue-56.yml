name: Apply Issue 56 Patch

on:
  push:
    branches: [fix/multimaterial-dialog-update]
    paths: ['.github/workflows/apply-issue-56.yml']

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multimaterial-dialog-update

      - name: Apply code changes to Plater.cpp
        run: |
          python3 << 'PYEOF'
          import re

          with open('src/slic3r/GUI/Plater.cpp', 'r') as f:
              lines = f.readlines()

          # === CHANGE 1: Remove "future update" message block ===
          # Find the line with "True multi-material support will be added"
          # and remove the 5-line block (Label creation + 3 properties + sizer add + blank)
          marker = 'True multi-material support will be added in a future update'
          new_lines = []
          i = 0
          while i < len(lines):
              if marker in lines[i]:
                  # Go back to find the start of this block (Label* future_msg line)
                  # Remove the previous line too (Label* future_msg = ...)
                  if new_lines and 'future_msg' in new_lines[-1]:
                      new_lines.pop()  # remove "Label* future_msg = ..." line
                  # Skip current line and next 3 lines (SetForeground, Wrap, Add, blank)
                  i += 1  # skip current (the _L line)
                  while i < len(lines) and 'future_msg' in lines[i]:
                      i += 1  # skip SetForegroundColour, Wrap lines
                  # Skip the main_sizer->Add line for future_msg
                  if i < len(lines) and 'main_sizer->Add(future_msg' in lines[i]:
                      i += 1
                  # Skip blank line after
                  if i < len(lines) and lines[i].strip() == '':
                      i += 1
              else:
                  new_lines.append(lines[i])
                  i += 1

          print(f'After removal: {len(lines)} -> {len(new_lines)} lines')
          lines = new_lines

          # === CHANGE 2: Add Option 3 after Option 2 ===
          # Find "main_sizer->Add(option2_box" and insert Option 3 after it
          option3_code = [
              '\n',
              '        // Option 3: Enable multimaterial optimisation\n',
              '        wxColour option3_bg = is_dark_mode ? wxColour(30, 40, 60) : wxColour("#E3F2FD");\n',
              '        wxColour option3_border = is_dark_mode ? wxColour(66, 165, 245) : wxColour("#42A5F5");\n',
              '        wxColour option3_text_color = is_dark_mode ? wxColour(240, 240, 240) : text_color;\n',
              '\n',
              '        StaticBox* option3_box = new StaticBox(this, wxID_ANY, wxDefaultPosition,\n',
              '                                               wxSize(wxWindowBase::FromDIP(470, this), -1));\n',
              '        option3_box->SetBackgroundColor(StateColor(std::make_pair(option3_bg, (int)StateColor::Normal)));\n',
              '        option3_box->SetBackgroundColour(option3_bg);\n',
              '        option3_box->SetBorderColor(StateColor(std::make_pair(option3_border, (int)StateColor::Normal)));\n',
              '        option3_box->SetBorderWidth(1);\n',
              '        option3_box->SetCornerRadius(wxWindowBase::FromDIP(6, this));\n',
              '\n',
              '        wxBoxSizer* option3_sizer = new wxBoxSizer(wxVERTICAL);\n',
              '        option3_sizer->AddSpacer(wxWindowBase::FromDIP(12, this));\n',
              '\n',
              '        Label* option3_title = new Label(option3_box, Label::Head_14,\n',
              '            _L("Option 3: Enable Multimaterial optimisation"));\n',
              '        option3_title->SetForegroundColour(option3_text_color);\n',
              '        option3_sizer->Add(option3_title, 0, wxLEFT | wxRIGHT, wxWindowBase::FromDIP(16, this));\n',
              '        option3_sizer->AddSpacer(wxWindowBase::FromDIP(8, this));\n',
              '\n',
              '        Label* option3_desc = new Label(option3_box, Label::Body_13,\n',
              '            _L("Click third-party icon \\u2192 Enable Helio Additive \\u2192 Check Enable Multimaterial Support"), LB_AUTO_WRAP);\n',
              '        option3_desc->SetForegroundColour(option3_text_color);\n',
              '        option3_desc->Wrap(wxWindowBase::FromDIP(440, this));\n',
              '        option3_sizer->Add(option3_desc, 0, wxEXPAND | wxLEFT | wxRIGHT, wxWindowBase::FromDIP(16, this));\n',
              '        option3_sizer->AddSpacer(wxWindowBase::FromDIP(12, this));\n',
              '\n',
              '        option3_box->SetSizer(option3_sizer);\n',
              '        main_sizer->Add(option3_box, 0, wxLEFT | wxRIGHT | wxBOTTOM, wxWindowBase::FromDIP(15, this));\n',
          ]

          insert_marker = 'main_sizer->Add(option2_box'
          result = []
          inserted = False
          for line in lines:
              result.append(line)
              if not inserted and insert_marker in line:
                  result.extend(option3_code)
                  inserted = True

          if inserted:
              print(f'Option 3 inserted successfully ({len(option3_code)} lines added)')
          else:
              print('ERROR: Could not find insertion point for Option 3!')
              exit(1)

          with open('src/slic3r/GUI/Plater.cpp', 'w') as f:
              f.writelines(result)

          print(f'Final file: {len(result)} lines')
          print('Patch applied successfully!')
          PYEOF

      - name: Verify changes
        run: |
          echo '=== Git diff stat ==='
          git diff --stat
          echo ''
          echo '=== Diff preview (first 80 lines) ==='
          git diff | head -80

      - name: Commit and push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git rm .github/workflows/apply-issue-56.yml
          git add src/slic3r/GUI/Plater.cpp
          git diff --cached --quiet && echo 'No changes to commit' && exit 1
          git commit -m "Update multimaterial rerouting dialog: remove outdated text, add Option 3

          - Remove 'True multi-material support will be added in a future update'
            subtext which is no longer accurate
          - Add Option 3 card directing users to enable multimaterial optimisation
            via third-party icon > Enable Helio Additive > Enable Multimaterial Support

          Closes #56

          https://claude.ai/code/session_01UXqPcVQCq1oAXgUGY72jeA"
          git push
          echo 'Changes pushed successfully!'
