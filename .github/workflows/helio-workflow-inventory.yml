name: Workflow inventory

# Enforces .github/helio-workflows.yml — this fork's decision record for which
# upstream-inherited workflows run here.
#
# Upstream ships repo infrastructure along with slicer code, and every sync pulls
# it in wholesale. Without a forcing function, inherited workflows accumulate
# unnoticed: some fail forever on credentials this fork has never had, some run
# against upstream's distribution channels. This check fails a PR that introduces
# a workflow nobody has classified, or that adds an undeclared dependency on an
# external secret.
#
# Helio-owned file: upstream will never touch it, so it carries no sync conflict
# surface. That is deliberate — see the header of .github/helio-workflows.yml.

on:
  # Deliberately NO `paths:` filter. GitHub evaluates path filters against only
  # the first 300 changed files, and an upstream sync routinely changes far more
  # (v2.4.2 changed 894). A sync that adds a workflow outside that truncated
  # window would skip the check entirely — precisely the case E1 exists to catch.
  # The job is a few seconds of Python, so running it on every PR is the cheap
  # side of that trade.
  pull_request:
  push:
    branches:
      - orca-latest-parity-bambu
  schedule:
    # Weekly, so manifest drift and newly-missing credentials surface even when
    # nobody is touching workflow files.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on every event, including pull_request. Holds NO credentials of any
  # kind, so it is safe for this job to execute the PR's own copy of the
  # validator.
  inventory:
    name: Check workflow inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check workflow inventory
        run: python3 scripts/helio/check_workflow_inventory.py

  # W3 ("a `run` workflow needs a secret this repo does not have") is the check
  # that would have caught the dedupe-issues.yml breakage five months early, so
  # it is worth keeping — but it needs to know which secrets exist, and that
  # must never be answered by handing credentials to PR-controlled code.
  #
  # Three properties make this safe:
  #   1. The `if:` gates on the REF, not just the event. The property that
  #      matters is "is the code this job checks out already reviewed?", and
  #      excluding pull_request alone does not establish it: workflow_dispatch
  #      accepts any branch, so a collaborator could dispatch this job against
  #      an unreviewed branch and run branch-controlled code while it holds the
  #      token. Restricting to the release branch covers every trusted entry
  #      point — push is already limited to it, schedule runs on it (it is the
  #      default branch), and manual dispatch stays available there — while
  #      skipping feature-branch dispatches.
  #   2. The runner only ever sees secret NAMES, read from the Actions secrets
  #      REST API, which does not return values. `toJSON(secrets)` — which
  #      serialises every name AND value into the environment — is not used.
  #   3. This job runs NO third-party actions and checks out NO code. It is
  #      curl and jq against the API and nothing else. The token is therefore
  #      never in scope alongside code from anywhere but this file. The earlier
  #      version ran `actions/checkout` and `actions/setup-python` at mutable
  #      major tags before the token step, so a retargeted tag would have
  #      executed in the same job the token later lands in; SHA-pinning would
  #      have narrowed that window, removing the actions closes it. Everything
  #      that needs the repository happens in `secret-presence` below, which
  #      has no credentials.
  secret-names:
    name: Read configured secret names
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/orca-latest-parity-bambu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.names.outputs.available }}
      # Secret NAMES only — GitHub restricts them to letters, digits and
      # underscores, so a space-separated list is unambiguous and stays a
      # single-line job output.
      names: ${{ steps.names.outputs.names }}
    steps:
      - name: Read configured secret names
        id: names
        env:
          # A dedicated fine-grained token with read-only "Secrets" repository
          # permission (and organization "Secrets: read" for the org-level
          # names). The default GITHUB_TOKEN cannot list secrets. When this is
          # unset the step degrades to a skip rather than failing — W3 is an
          # advisory check and must not gate the release branch on a token
          # nobody has configured yet.
          INVENTORY_TOKEN: ${{ secrets.WORKFLOW_INVENTORY_TOKEN }}
        run: |
          set -euo pipefail

          skip() {
            echo "::${1}::${2} Skipping secret-presence (W3)."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "${INVENTORY_TOKEN}" ]; then
            skip notice "WORKFLOW_INVENTORY_TOKEN is not configured."
          fi

          # Both endpoints return names and metadata only — never values.
          # Paginated: a repo with more than 100 secrets would otherwise have
          # its tail silently reported as absent by W3.
          # 50 pages is 5,000 names, far past any real repository. The bound is
          # here so a malformed response can never spin this job for its whole
          # timeout instead of failing.
          MAX_PAGES=50
          collect() {
            local path="$1" page=1 count
            while [ "$page" -le "$MAX_PAGES" ]; do
              local status
              status=$(curl -sS -o /tmp/page.json -w '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${INVENTORY_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}${path}?per_page=100&page=${page}") || return 1
              [ "$status" = "200" ] || { echo "$status" > /tmp/http_status; return 1; }
              jq -r '.secrets[].name' /tmp/page.json >> /tmp/secret-names.txt
              count=$(jq -r '.secrets | length' /tmp/page.json)
              [ "$count" -eq 100 ] || break
              page=$((page + 1))
            done
          }

          : > /tmp/secret-names.txt
          rm -f /tmp/http_status

          if ! collect "/repos/${GITHUB_REPOSITORY}/actions/secrets"; then
            skip warning "Repository secrets API returned HTTP $(cat /tmp/http_status 2>/dev/null || echo '?')."
          fi

          # Organization secrets available to this repository. A secret granted
          # at the org level is present at runtime, so omitting these makes W3
          # report a configured secret as absent. 404 means the owner is not an
          # organization and there is nothing to add; any other failure means an
          # incomplete picture, and a partial answer here produces confidently
          # wrong warnings.
          if ! collect "/repos/${GITHUB_REPOSITORY}/actions/organization-secrets"; then
            org_status=$(cat /tmp/http_status 2>/dev/null || echo '?')
            if [ "$org_status" = "404" ]; then
              echo "::notice::No organization secrets endpoint (owner is not an org)."
            else
              skip warning "Organization secrets API returned HTTP ${org_status}, so the secret list is incomplete."
            fi
          fi

          rm -f /tmp/page.json /tmp/http_status
          # `|| true` on the filter: a repo with no secrets at all is a valid
          # state, and grep exiting 1 there would fail the step under pipefail.
          names=$(sort -u /tmp/secret-names.txt \
            | { grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true; } \
            | tr '\n' ' ')
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "Read $(printf '%s' "${names}" | wc -w) configured secret name(s)."

  # No credentials. Consumes the names produced above as ordinary data.
  secret-presence:
    name: Check declared secrets exist
    needs: secret-names
    if: needs.secret-names.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check declared secrets exist
        env:
          # Names only, via env rather than script interpolation. No secret
          # values exist anywhere in this job.
          SECRET_NAMES: ${{ needs.secret-names.outputs.names }}
        run: |
          set -euo pipefail
          tr ' ' '\n' <<< "${SECRET_NAMES}" \
            | { grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true; } > /tmp/secret-names.txt
          SECRET_NAMES_FILE=/tmp/secret-names.txt \
            python3 scripts/helio/check_workflow_inventory.py
