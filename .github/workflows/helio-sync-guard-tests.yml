# Runs the upstream-sync guard regression suite.
#
# `scripts/helio/test_sync_noop_guards.py` extracts the real `check` and `graft`
# step bodies out of helio-upstream-sync.yml and runs them against synthetic
# repositories. Until this workflow existed, nothing executed it: a ~700-line
# suite pinning the workflow's most failure-prone logic ran only when someone
# remembered to, which is precisely the rot the workflow inventory (#106) exists
# to prevent.
#
# It is a separate Helio-owned workflow rather than a job bolted onto the
# upstream-owned shellcheck.yml, so it is not a new conflict site on every
# upstream sync.
name: Helio sync guard tests

on:
  # Deliberately NO `paths:` filter, for the same reason helio-workflow-inventory.yml
  # has none: GitHub evaluates path filters against only the first 300 changed
  # files, and the changed-file list is ordered by path. `scripts/helio/**` sorts
  # after `resources/**`, which is where a sync's bulk lives, so on a sync PR
  # those paths are always outside the window. Measured on this branch's own
  # sync commits — files sorting before `scripts/helio/`:
  #
  #   v2.4.2      (ce472ef4,   894 files)    857
  #   v2.4.1      (eaf3cb94, 8,059 files)  7,940
  #   v2.4.0-beta (7322afa4, 15,081 files) 14,617
  #
  # A sync whose conflict resolution also touches `scripts/helio/**` would
  # therefore skip this suite on exactly the PR that rewrites the logic it
  # guards. The suite is ~30s of Python, so running it unfiltered is the cheap
  # side of that trade.
  pull_request:
  push:
    branches:
      - orca-latest-parity-bambu
  schedule:
    # Weekly, so drift surfaces when nobody is editing these files. The suite
    # depends on the runner image, Python and PyYAML as well as on this repo, and
    # between #121 (Aug) and #130 (Sep) nothing triggered it at all. Without this,
    # a breakage caused from outside the repo would first appear on a sync-workflow
    # edit — the worst moment to start debugging the harness instead of the sync.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-guards:
    name: Upstream sync guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # The suite builds its own synthetic repositories and never inspects
          # this one's history, so a shallow checkout is enough.
          fetch-depth: 1
          # Nothing here talks to the network or to this repo's remote, so the
          # job has no use for a credential in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        # The harness parses helio-upstream-sync.yml to extract the step bodies
        # under test, rather than transcribing them.
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Configure git identity
        # The fixtures commit into throwaway repositories; runners have no
        # global identity and `git commit` fails without one.
        run: |
          git config --global user.email "ci@helioadditive.com"
          git config --global user.name "Helio CI"
          git config --global init.defaultBranch main

      - name: Run guard suite
        run: python3 scripts/helio/test_sync_noop_guards.py
