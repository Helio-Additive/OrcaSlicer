# Runs the Helio upstream-automation guard regression suites.
#
# `scripts/helio/test_sync_noop_guards.py` extracts the real `check` and `graft`
# step bodies out of helio-upstream-sync.yml and runs them against synthetic
# repositories. Until this workflow existed, nothing executed it: a ~700-line
# suite pinning the workflow's most failure-prone logic ran only when someone
# remembered to, which is precisely the rot the workflow inventory (#106) exists
# to prevent.
#
# `scripts/helio/test_upstream_watch_tags.py` does the same for
# helio-upstream-watch.yml's new-tag selection, which answered "None" for every
# upstream release for as long as it existed. Both suites test code lifted out
# of a workflow, so both belong to the same trigger set — which is why
# helio-upstream-watch.yml is in the paths below. The job name stays
# "Upstream sync guards" so no branch-protection rule has to be re-pointed.
#
# It is a separate Helio-owned workflow rather than a job bolted onto the
# upstream-owned shellcheck.yml, so it is not a new conflict site on every
# upstream sync.
name: Helio sync guard tests

on:
  push:
    paths:
      - '.github/workflows/helio-upstream-sync.yml'
      - '.github/workflows/helio-upstream-watch.yml'
      - '.github/workflows/helio-sync-guard-tests.yml'
      - 'scripts/helio/**'
  pull_request:
    paths:
      - '.github/workflows/helio-upstream-sync.yml'
      - '.github/workflows/helio-upstream-watch.yml'
      - '.github/workflows/helio-sync-guard-tests.yml'
      - 'scripts/helio/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-guards:
    name: Upstream sync guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The suite builds its own synthetic repositories and never inspects
          # this one's history, so a shallow checkout is enough.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        # The harnesses parse helio-upstream-sync.yml and
        # helio-upstream-watch.yml to extract the step bodies under test,
        # rather than transcribing them.
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Configure git identity
        # The fixtures commit into throwaway repositories; runners have no
        # global identity and `git commit` fails without one.
        run: |
          git config --global user.email "ci@helioadditive.com"
          git config --global user.name "Helio CI"
          git config --global init.defaultBranch main

      - name: Run guard suite
        run: python3 scripts/helio/test_sync_noop_guards.py

      - name: Run upstream-watch tag-selection suite
        # Separate step rather than appended to the suite above, so a failure
        # names which workflow's logic broke without reading the log.
        run: python3 scripts/helio/test_upstream_watch_tags.py
