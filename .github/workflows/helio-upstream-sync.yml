name: Helio Upstream Sync

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:
    inputs:
      sync_target:
        description: 'Sync to latest upstream tag or upstream main'
        required: false
        type: choice
        default: 'latest-tag'
        options:
          - latest-tag
          - main
      release_branch:
        description: 'Helio release branch to sync into'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: helio-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release branch
        id: branch
        run: |
          if [ -n "${{ inputs.release_branch }}" ]; then
            echo "target=${{ inputs.release_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ vars.HELIO_RELEASE_BRANCH || 'orca-latest-parity-bambu' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.target }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/SoftFever/OrcaSlicer.git || true
          git fetch upstream --tags --force
          git fetch upstream main

      - name: Determine sync mode
        id: mode
        run: |
          # Scheduled runs always sync to latest tag; manual runs use the input
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "sync_mode=latest-tag" >> "$GITHUB_OUTPUT"
          else
            echo "sync_mode=${{ inputs.sync_target || 'latest-tag' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve sync target
        id: target
        run: |
          MODE="${{ steps.mode.outputs.sync_mode }}"

          if [ "$MODE" = "main" ]; then
            SYNC_REF="upstream/main"
            SYNC_SHA=$(git rev-parse upstream/main)
            SHORT_SHA=$(echo "$SYNC_SHA" | cut -c1-7)
            SYNC_LABEL="main@${SHORT_SHA}"
            BRANCH_NAME="helio-upstream-main-$(date '+%Y-%m-%d')-${SHORT_SHA}"
            TRACKING_TAG="helio-last-synced-main"
          else
            # Find latest upstream stable v* tag (exclude alpha/beta/rc/pre/dev
            # prereleases — git's version:refname sort otherwise ranks e.g.
            # v2.3.2-rc2 above v2.3.2, causing stable releases to be missed).
            # The regex tolerates both `-rc2`-style and dotted `-rc.1`-style
            # SemVer suffixes. `|| true` keeps pipefail happy when grep finds
            # nothing (only prereleases exist) — handled by the empty-check below.
            LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname \
              | grep -Evi -- '-(alpha|beta|rc|pre|dev)([.-]?[0-9A-Za-z]+)?$' \
              | head -1 || true)
            if [ -z "$LATEST_TAG" ]; then
              echo "No stable upstream release tags found" >&2
              exit 1
            fi
            SYNC_REF="$LATEST_TAG"
            SYNC_SHA=$(git rev-parse "$LATEST_TAG^{commit}")
            SHORT_SHA=$(echo "$SYNC_SHA" | cut -c1-7)
            SYNC_LABEL="$LATEST_TAG"
            BRANCH_NAME="helio-release-candidate-${LATEST_TAG}"
            TRACKING_TAG="helio-last-synced"
          fi

          echo "sync_ref=$SYNC_REF" >> "$GITHUB_OUTPUT"
          echo "sync_sha=$SYNC_SHA" >> "$GITHUB_OUTPUT"
          echo "sync_label=$SYNC_LABEL" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "tracking_tag=$TRACKING_TAG" >> "$GITHUB_OUTPUT"
          echo "Sync target: $SYNC_LABEL ($SYNC_REF -> $SYNC_SHA)"

      - name: Check if already synced
        id: check
        # SYNC_LABEL is an upstream tag name. Interpolating it into the script
        # body would make an upstream-controlled string part of the shell source,
        # where a quote or `$(` would escape the assignment. Via `env` the shell
        # substitutes it after parsing, so it cannot. (SYNC_SHA is hex from
        # rev-parse and TRACKING_TAG is one of two literals, but they go through
        # env too so the pattern is uniform and nobody has to re-derive which
        # values are safe.)
        env:
          SYNC_SHA: ${{ steps.target.outputs.sync_sha }}
          SYNC_LABEL: ${{ steps.target.outputs.sync_label }}
          TRACKING_TAG: ${{ steps.target.outputs.tracking_tag }}
        run: |
          # Shared with the `graft` step below, so "does this branch hold
          # release X?" has one implementation rather than two that drift.
          CONTENT="$GITHUB_WORKSPACE/scripts/helio/upstream_content.sh"

          # Moving the tracking tag requires force-updating a tag on this repo,
          # which the workflow token is not always permitted to do (observed:
          # HTTP 403). That must not fail a sync run — the tag is a convenience,
          # and every decision below has a fallback that does not need it. It
          # does need to be LOUD, because a tag that silently never moves is how
          # this workflow came to re-propose an already-merged release (#110).
          update_tracking_tag() {
            git tag -f "$TRACKING_TAG" "$1"
            if git push origin "refs/tags/$TRACKING_TAG" --force; then
              echo "Updated $TRACKING_TAG -> $1"
            else
              # NOTE ON REMOTES: the push above uses `origin` because that is
              # what actions/checkout configures — inside Actions, origin IS
              # this fork. The healing command below is run by a HUMAN in their
              # own clone, where CLAUDE.md says origin is upstream OrcaSlicer
              # and `helio` is this fork. Telling a maintainer to push a Helio
              # tracking tag to `origin` would aim it at upstream.
              echo "::warning title=Tracking tag not updated::Could not force-update \`$TRACKING_TAG\` to $1 (the token appears to lack permission to update tags). The sync itself is unaffected — nothing below depends on the tag — but it will keep pointing at a stale commit until a maintainer runs, from a clone whose fork remote is \`helio\`: git push helio +$1:refs/tags/$TRACKING_TAG"
            fi
          }

          # version.inc records which upstream release this tree was synced to.
          # For tag-mode syncs it is a better BASELINE than the tracking tag: the
          # tag is only advanced by a successful push at the end of a run, so an
          # out-of-band merge, or a run whose tag push was refused, leaves it
          # behind while the tree moves on. `helio-last-synced` sat at v2.3.2-rc2
          # through three releases for exactly that reason.
          #
          # It is NOT proof of content, and must never be treated as such. It is
          # a version string in a file; the release it names can stop describing
          # the tree without the file changing:
          #   - upstream force-retags a release after we synced the original
          #     commit, so the name now resolves somewhere we have never merged
          #   - version.inc is bumped locally ahead of the content landing
          # In both cases the string equals the sync target while the target's
          # content is absent. Skipping on that would be a SILENT false negative
          # — upstream work dropped, and every later run reaching the same wrong
          # conclusion — which is strictly worse than the empty PR of #110. So
          # version.inc selects the baseline and nothing more; the merged-tree
          # comparison in `noop` is the only thing here that decides "synced".
          VERSION_COMMIT=""
          VERSION_TAG=""
          if [ "$TRACKING_TAG" = "helio-last-synced" ]; then
            VER=$(grep -oP 'SoftFever_VERSION[^"]*"\K[^"]+' version.inc 2>/dev/null || true)
            if [ -n "$VER" ]; then
              for cand in "v$VER" "$VER"; do
                if git rev-parse -q --verify "refs/tags/$cand^{commit}" >/dev/null 2>&1; then
                  VERSION_COMMIT=$(git rev-parse "refs/tags/$cand^{commit}")
                  VERSION_TAG="$cand"
                  break
                fi
              done
            fi
          fi

          # version.inc naming the sync target means "we expect to be synced".
          # Record it, do not act on it: the run continues to the grafted merge
          # so the tree comparison can confirm or refute it. Deliberately no
          # `update_tracking_tag` here either — every write of that tag must be
          # backed by content (an ancestry hit, a clean no-diff trial merge, an
          # identical merged tree, or a completed sync), so that the tag stays
          # usable as evidence at line ~165 below.
          VERSION_MATCHES_TARGET=false
          if [ -n "$VERSION_COMMIT" ] && [ "$VERSION_COMMIT" = "$SYNC_SHA" ]; then
            VERSION_MATCHES_TARGET=true
            echo "version.inc reports $VERSION_TAG, which is the sync target ($SYNC_LABEL) — expecting a no-op, but continuing to the merge to verify it by content"
          fi

          # Determine baseline
          LAST_SYNCED=""
          TAG_UNTRUSTED=false
          if git rev-parse "$TRACKING_TAG" >/dev/null 2>&1; then
            SYNCED_COMMIT=$(git rev-parse "$TRACKING_TAG")
            # The tag matching the target is a REASON TO LOOK, not an answer.
            #
            # It used to exit here on its own, on the grounds that the tag is
            # only ever written after content was validated. That was not true:
            # the tag was advanced when a sync PR was *created*. So a PR closed
            # unmerged left the tag naming a release this branch never received,
            # and this exit then skipped that release permanently — every run,
            # for ever. Removing the PR-creation write stops NEW tags being
            # wrong; it does nothing for tags already written that way, which is
            # why the claim has to be rechecked here rather than trusted.
            if [ "$SYNCED_COMMIT" = "$SYNC_SHA" ]; then
              if "$CONTENT" holds "$SYNC_SHA"; then
                echo "Already synced to $SYNC_LABEL (tracking tag, confirmed by content)"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Rejecting the tag at THIS exit is not enough. The tag also feeds
              # the baseline, and a baseline equal to the target hits a second,
              # separate "nothing to sync" exit further down — so the bad tag
              # skipped the release anyway, through a different door. Mark it
              # untrusted and let every consumer below ignore it.
              TAG_UNTRUSTED=true
              echo "::warning title=Tracking tag does not match the tree::\`$TRACKING_TAG\` names $SYNC_LABEL, but this branch does not hold that release's content (never applied: $("$CONTENT" missing "$SYNC_SHA" 2>/dev/null | head -5 | tr '\n' ' ')). The tag was probably advanced by a sync PR that was never merged. Ignoring the tag for this run and syncing anyway."
            fi
            # Prefer version.inc when it names a NEWER upstream release than the
            # tag does. The baseline feeds the changelog and the Helio-relevant
            # change report, so a stale one does not just add noise — it reports
            # changes that were reviewed and merged one or more syncs ago.
            #
            # Not when version.inc names the target itself: a baseline equal to
            # the thing being synced makes the changelog range empty and, worse,
            # feeds the graft step a circular base (see the strict-ancestor
            # requirement there). Fall back to the tag in that case.
            if [ -n "$VERSION_COMMIT" ] && \
               [ "$VERSION_COMMIT" != "$SYNC_SHA" ] && \
               git merge-base --is-ancestor "$SYNCED_COMMIT" "$VERSION_COMMIT" && \
               [ "$SYNCED_COMMIT" != "$VERSION_COMMIT" ]; then
              echo "Tracking tag ($TRACKING_TAG -> $SYNCED_COMMIT) is behind version.inc ($VERSION_TAG); using version.inc as the baseline"
              LAST_SYNCED="$VERSION_TAG"
            fi
            # For tag mode, try to find the v* tag at that commit
            if [ -z "$LAST_SYNCED" ] && [ "$TAG_UNTRUSTED" != "true" ] && \
               [ "$TRACKING_TAG" = "helio-last-synced" ]; then
              LAST_SYNCED=$(git tag -l --points-at "$SYNCED_COMMIT" 'v*' | head -1)
            fi
            if [ -z "$LAST_SYNCED" ] && [ "$TAG_UNTRUSTED" != "true" ]; then
              LAST_SYNCED="$TRACKING_TAG"
            fi
            # The tag is untrusted and version.inc gave us nothing usable, so
            # there is no record left to take a baseline from. Fall back to the
            # newest release whose content this branch demonstrably holds — the
            # same content test, which is the only thing here that has not been
            # wrong about this branch.
            if [ -z "$LAST_SYNCED" ]; then
              LAST_SYNCED=$("$CONTENT" first-held "$("$CONTENT" base-below "$SYNC_SHA" 1)" || true)
              if [ -n "$LAST_SYNCED" ]; then
                echo "Baseline taken from content: $LAST_SYNCED is the newest release this branch holds"
              else
                LAST_SYNCED="v2.3.2-rc2"
                echo "No usable record and no validated release; falling back to the bootstrap baseline"
              fi
            fi
          else
            if [ -n "$VERSION_TAG" ] && [ "$VERSION_COMMIT" != "$SYNC_SHA" ]; then
              echo "No previous sync tag found, using version.inc ($VERSION_TAG) as baseline"
              LAST_SYNCED="$VERSION_TAG"
            elif [ "$TRACKING_TAG" = "helio-last-synced" ]; then
              # Bootstrap baseline, only reachable when version.inc names no tag
              # upstream has (a local version bump, say).
              echo "No previous sync tag and no usable version.inc, using v2.3.2-rc2 as baseline"
              LAST_SYNCED="v2.3.2-rc2"
            else
              # First main sync — capture current HEAD SHA as baseline (before merge moves it)
              LAST_SYNCED=$(git rev-parse HEAD)
              echo "No previous main sync tag found, using HEAD ($LAST_SYNCED) as baseline"
            fi
          fi

          # Skip if baseline and target point to the same commit
          BASELINE_COMMIT=$(git rev-parse "$LAST_SYNCED^{commit}" 2>/dev/null || true)
          if [ -z "$BASELINE_COMMIT" ]; then
            echo "Error: Unable to resolve baseline ($LAST_SYNCED) to a commit."
            exit 1
          fi

          # The guards above keep version.inc from steering the baseline onto the
          # target, so reaching this with an equal baseline means a tag genuinely
          # records this commit as synced. If version.inc is the only reason the
          # two coincide, do not skip — that is the unvalidated claim again.
          if [ "$BASELINE_COMMIT" = "$SYNC_SHA" ] && [ "$VERSION_MATCHES_TARGET" != "true" ]; then
            echo "Baseline $LAST_SYNCED and target $SYNC_LABEL point to the same commit — nothing to sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the sync target is already an ancestor of HEAD, the merge was
          # done out-of-band (e.g. a manual PR).  Update the tracking tag and skip.
          if git merge-base --is-ancestor "$SYNC_SHA" HEAD; then
            echo "Target $SYNC_LABEL ($SYNC_SHA) is already merged into HEAD — updating tracking tag and skipping"
            update_tracking_tag "$SYNC_SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Handle squash merges: the ancestor check above fails when a PR was
          # squash-merged because the original upstream commit is not in the
          # history.  Try a trial merge — if it succeeds with no diff, the
          # content is already incorporated.
          #
          # Note this runs BEFORE the merge-base graft, so on a squash-flattened
          # history the trial merge is computed against the same wrong base the
          # graft exists to correct, and usually conflicts rather than reporting
          # "no diff". Like the ancestor check above it, it is ancestry-dependent:
          # cheap, catches the easy cases, and cannot be relied on.
          #
          # The AUTHORITATIVE no-op detection is the merged-tree comparison in the
          # `noop` step, after the real grafted merge — that is the only guard here
          # that reasons about content. The version.inc check above is explicitly
          # NOT authoritative; it compares a version string and only sets an
          # expectation. See #110.
          if git merge --no-commit --no-ff "$SYNC_SHA" 2>/dev/null; then
            if git diff --cached --quiet 2>/dev/null; then
              echo "Target $SYNC_LABEL already incorporated (squash merge detected) — updating tracking tag and skipping"
              git merge --abort 2>/dev/null || git reset --hard HEAD
              update_tracking_tag "$SYNC_SHA"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git merge --abort 2>/dev/null || git reset --hard HEAD 2>/dev/null || true

          # The content test, which is what the two checks above only approximate.
          #
          # Both of them ask an ANCESTRY question, and this fork squash-merges,
          # so both are defeated by exactly the history they run against. That is
          # survivable for a clean sync — the merged-tree comparison in `noop`
          # catches it later. It is NOT survivable for a sync that CONFLICTED:
          # the resolution branch is squash-merged too, the ancestor check misses
          # it, the pre-graft trial merge conflicts against the wrong base, and
          # `noop` never runs because `noop` only runs after a clean merge. So
          # nothing would ever record that a resolved sync had landed, and the
          # workflow would re-conflict and refresh the conflict issue every week
          # for a sync that is already on the branch. That regression arrived
          # with the removal of the PR-creation tag write, which had been
          # covering for it.
          #
          # This asks the tree directly, so it is immune to the squash and covers
          # the conflict path, the out-of-band merge, and the ordinary one alike.
          if "$CONTENT" holds "$SYNC_SHA"; then
            echo "Target $SYNC_LABEL is already present in this branch's content — updating tracking tag and skipping"
            update_tracking_tag "$SYNC_SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "last_synced=$LAST_SYNCED" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Exit if already synced
        if: steps.check.outputs.skip == 'true'
        env:
          SYNC_LABEL: ${{ steps.target.outputs.sync_label }}
        run: echo "Nothing to sync — already at $SYNC_LABEL."

      - name: Create sync branch
        if: steps.check.outputs.skip != 'true'
        id: sync_branch
        env:
          BRANCH: ${{ steps.target.outputs.branch_name }}
        run: |
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Upstream-sync PRs are squash-merged into the release branch (required by
      # the "verified signatures" branch rule — a squash yields a single
      # GitHub-signed commit instead of hundreds of unsigned upstream commits).
      # The side effect is that squashing discards the upstream ancestry, so the
      # NEXT sync's merge-base falls all the way back to the last commit we still
      # share with upstream — inflating the conflict set enormously (e.g. a
      # v2.4.0-beta -> v2.4.1 delta of ~5 files exploded to 7,876 because the
      # base fell back to v2.3.2). See HELIO_INTEGRATION.md ("Merge-base graft").
      #
      # Fix: before merging, ephemerally graft the upstream commit our current
      # content is based on onto the branch tip via `git replace --graft`. This
      # is LOCAL-ONLY (a refs/replace/* overlay that is never pushed) and is
      # removed again before any push, so nothing unsigned ever reaches a
      # protected branch. It only corrects git's merge-base computation.
      - name: Establish correct merge base (ephemeral graft)
        if: steps.check.outputs.skip != 'true'
        id: graft
        env:
          SYNC_SHA: ${{ steps.target.outputs.sync_sha }}
          TRACKING_TAG: ${{ steps.target.outputs.tracking_tag }}
        run: |
          set -euo pipefail
          TIP=$(git rev-parse HEAD)

          # Determine PREV_UPSTREAM = the upstream commit our branch content is
          # based on.
          #  - Tag-release syncs (TRACKING_TAG=helio-last-synced): version.inc names
          #    the upstream release the tree was synced to, so prefer it (the
          #    tracking tag can lag) — but only once its content is VALIDATED, see
          #    below. Tracking tag as fallback.
          #  - Main syncs (TRACKING_TAG=helio-last-synced-main): version.inc names
          #    an older tagged release, NOT the last synced main commit, so it must
          #    NOT be used — prefer the tracking tag, which points at that commit.
          #
          # THE GRAFT BASE IS A SAFETY-CRITICAL CHOICE, AND IT IS ASYMMETRIC.
          # Too OLD is merely expensive: git recomputes more of the delta and the
          # conflict set inflates. Too NEW silently DROPS UPSTREAM WORK — git reads
          # the content between the real base and the claimed one as deliberate
          # local reversions and never re-applies it. The merge succeeds, the tree
          # changes, the PR opens, and it claims a release whose content is only
          # partly there. Nothing reports it. So a candidate is used only when
          # there is evidence the tree really holds it.
          #
          # Two ways version.inc can name something too new:
          #  1. It names the sync target itself. `--is-ancestor` is true for a
          #     commit and itself, so without a strict test this grafts the target
          #     onto the tip: the merge-base becomes the target, the merge is a
          #     no-op BY CONSTRUCTION, and the merged-tree comparison "confirms"
          #     already-synced for a release never merged — the one content-based
          #     guard reduced to a rubber stamp.
          #  2. It names an INTERMEDIATE release we do not hold (tree at v2.4.1,
          #     version.inc says v2.4.2, target v2.4.3). v2.4.2 is a strict
          #     ancestor of v2.4.3, so a strictness test alone accepts it, and
          #     only v2.4.2..v2.4.3 gets applied. v2.4.2's content is dropped.
          #
          # Case 1 is handled by SELF_NAMED below. Case 2 needs actual validation.
          #
          # Validating a candidate by its OWN delta is not enough, and that was
          # the third route to the same silent drop. Grafting the candidate's
          # first parent and trial-merging the candidate proves only that the
          # candidate's LAST STEP is present; everything below it is assumed. The
          # assumption is exactly what is false when the gap sits underneath a
          # small step: tree at v2.4.0, version.inc says v2.4.2, v2.4.1 added a
          # file, v2.4.2 only bumped version.inc. The v2.4.2 delta is a version
          # string we already have, so the trial passes, v2.4.2 becomes the base,
          # and v2.4.1's file is dropped from the sync. The same hole applies to
          # the tracking tag, which was not validated at all — and it can name a
          # commit this branch does not hold, because it is advanced when a sync
          # PR is *created*, not when it is merged (see "Note pending sync").
          #
          # So validate INHERITED content, and compare TREES rather than names.
          #
          # That work lives in scripts/helio/upstream_content.sh, shared with the
          # `check` step above, so "does this branch hold release X?" has one
          # implementation. It was inline here before, which is exactly why the
          # check step could not use it and went on trusting the tracking tag.
          #
          # Comparing changed path NAMES is not enough either: if upstream edits
          # one hunk of a file and Helio independently edits another hunk, the
          # path appears on both sides and a name-level set difference cancels it
          # out while upstream's hunk is genuinely absent. The script compares
          # blob ids, and for the remainder where our blob matches neither side
          # it runs a three-way merge to decide whether upstream's change is
          # already in ours.
          CONTENT="$GITHUB_WORKSPACE/scripts/helio/upstream_content.sh"

          # Candidates in preference order. Every one of them is a CLAIM about
          # what this tree contains, and every one of them is checked against the
          # tree before it can steer the merge.
          PREV=""
          SELF_NAMED=false
          CANDS=()
          CDESC=()
          if [ "$TRACKING_TAG" = "helio-last-synced" ]; then
            VER=$(grep -oP 'SoftFever_VERSION[^"]*"\K[^"]+' version.inc 2>/dev/null || true)
            if [ -n "$VER" ]; then
              for cand in "v$VER" "$VER"; do
                if git rev-parse -q --verify "refs/tags/$cand^{commit}" >/dev/null 2>&1; then
                  c=$(git rev-parse "refs/tags/$cand^{commit}")
                  if [ "$c" = "$SYNC_SHA" ]; then SELF_NAMED=true; continue; fi
                  if git merge-base --is-ancestor "$c" "$SYNC_SHA"; then
                    CANDS+=("$c"); CDESC+=("version.inc ($cand)")
                    break
                  fi
                fi
              done
            fi
          fi
          if git rev-parse -q --verify "$TRACKING_TAG^{commit}" >/dev/null 2>&1; then
            c=$(git rev-parse "$TRACKING_TAG^{commit}")
            if [ "$c" = "$SYNC_SHA" ]; then
              SELF_NAMED=true
            elif git merge-base --is-ancestor "$c" "$SYNC_SHA"; then
              CANDS+=("$c"); CDESC+=("the tracking tag ($TRACKING_TAG)")
            fi
          fi

          # Our records name the sync target itself. Use the target's FIRST
          # PARENT: it says exactly what the record means — "our content is based
          # on this release" — and being strictly older it cannot make the merge a
          # no-op by construction. If we really hold the release the merge is
          # clean and empty; if we do not, the delta arrives and the tree changes.
          if [ "$SELF_NAMED" = "true" ]; then
            p=$(git rev-parse -q --verify "$SYNC_SHA^1" 2>/dev/null || true)
            if [ -n "$p" ]; then
              CANDS+=("$p"); CDESC+=("the sync target's first parent")
            fi
          fi

          if [ "${#CANDS[@]}" -gt 0 ]; then
            for idx in "${!CANDS[@]}"; do
              c="${CANDS[$idx]}"; d="${CDESC[$idx]}"
              # base-ok, not holds: an undecidable path must not cost the
              # graft. The skip decision in `check` uses the strict form.
              if "$CONTENT" base-ok "$c"; then
                PREV="$c"
                echo "$d names $c and this tree holds its inherited content — using it as the merge base."
                break
              fi
              # Name the files, not just the verdict: "the tree does not hold
              # v2.4.2" is not actionable, "src/mid.c was never applied" is.
              rejected=$("$CONTENT" missing "$c" 2>/dev/null | head -5 | tr '\n' ' ' || true)
              held=$("$CONTENT" first-held "$("$CONTENT" base-below "$c" 1)" || true)
              if [ -n "$held" ]; then
                PREV="$held"
                echo "::warning title=Records do not match the tree::$d names \`$c\`, but this tree does not hold that release's inherited content (never applied: ${rejected:-see log}). Using \`$held\` instead — the newest commit whose content is actually present. Grafting \`$c\` would make git read the missing changes as deliberate reversions and drop them from this sync. Someone should reconcile version.inc / \`$TRACKING_TAG\` with what the branch contains."
                break
              fi
              echo "::warning title=Merge base candidate rejected::$d names \`$c\`, but this tree does not hold its content (never applied: ${rejected:-see log}) and no validated older base was found within $MAX_WALK steps."
            done
          fi

          # Graft only when PREV is a real, newer common ancestor that git does
          # not already know about (i.e. history was flattened by a squash).
          if [ -n "$PREV" ] && ! git merge-base --is-ancestor "$PREV" "$TIP"; then
            git replace --graft "$TIP" $(git rev-parse "$TIP^@") "$PREV"
            echo "grafted=true" >> "$GITHUB_OUTPUT"
            echo "graft_commit=$TIP" >> "$GITHUB_OUTPUT"
            echo "prev_upstream=$PREV" >> "$GITHUB_OUTPUT"
            echo "Grafted $PREV onto $TIP — merge-base corrected to the last synced upstream commit."
          else
            echo "grafted=false" >> "$GITHUB_OUTPUT"
            echo "No graft applied (no newer shared upstream ancestor found; using default merge-base)."
          fi

      - name: Attempt merge
        if: steps.check.outputs.skip != 'true'
        id: merge
        env:
          SYNC_REF: ${{ steps.target.outputs.sync_ref }}
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Record the target-branch tip BEFORE merging. The squash step uses this
          # as the single parent. Do not derive it from HEAD^1 after the merge: a
          # fast-forwardable sync (bootstrap / no local delta) produces no merge
          # commit, so HEAD^1 would be the upstream parent and the squash would
          # still carry upstream commits.
          echo "pre_merge=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if git merge "$SYNC_REF" --no-edit; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"

            # Write the conflict list to a file rather than a step output / env
            # var. A large list (thousands of files) overflows the OS argument
            # limit when passed as an env var into a later step, crashing it with
            # "Argument list too long" before the tracking issue can be created.
            git diff --name-only --diff-filter=U > "$GITHUB_WORKSPACE/sync-conflicts.txt"
            COUNT=$(wc -l < "$GITHUB_WORKSPACE/sync-conflicts.txt" | tr -d ' ')
            echo "conflict_count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Merge produced $COUNT conflicted files."
          fi

      # Drop the local replace overlay now that the merge is done, so every
      # subsequent push sends only real (signed) history. Runs regardless of
      # merge outcome; a conflicted merge is aborted later in the push step.
      - name: Remove ephemeral graft
        if: always() && steps.graft.outputs.grafted == 'true'
        run: git replace -d "${{ steps.graft.outputs.graft_commit }}" || true

      # Last line of defence against proposing a sync that changes nothing (#110,
      # which opened #107 re-proposing v2.4.2 three and a half hours after #96
      # merged it).
      #
      # Every earlier guard reasons about ANCESTRY — is the target already an
      # ancestor, does a trial merge apply cleanly — and ancestry is exactly what
      # squash-merging this fork's sync PRs destroys. This one compares the
      # merged TREE with the tree of the target branch tip. If they are equal the
      # merge produced no change, whatever the history says, and there is nothing
      # to open a PR about.
      - name: Detect no-op merge
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'clean'
        id: noop
        env:
          SYNC_SHA: ${{ steps.target.outputs.sync_sha }}
          SYNC_LABEL: ${{ steps.target.outputs.sync_label }}
          TRACKING_TAG: ${{ steps.target.outputs.tracking_tag }}
          PRE_MERGE: ${{ steps.merge.outputs.pre_merge }}
        run: |
          MERGED_TREE=$(git rev-parse 'HEAD^{tree}')
          BASE_TREE=$(git rev-parse "${PRE_MERGE}^{tree}")

          if [ "$MERGED_TREE" != "$BASE_TREE" ]; then
            echo "noop=false" >> "$GITHUB_OUTPUT"
            echo "Merge changed the tree — continuing."
            exit 0
          fi

          echo "noop=true" >> "$GITHUB_OUTPUT"
          echo "The merge of $SYNC_LABEL produced a tree identical to the target branch — its content is already incorporated. Not opening a PR."

          git tag -f "$TRACKING_TAG" "$SYNC_SHA"
          if git push origin "refs/tags/$TRACKING_TAG" --force; then
            TAG_NOTE="Tracking tag \`$TRACKING_TAG\` advanced to \`$SYNC_SHA\`."
          else
            # `helio`, not `origin`: this text is read by a human in their own
            # clone, where origin is upstream OrcaSlicer (CLAUDE.md → Git
            # Workflow). The push above correctly uses origin because inside
            # Actions origin is this fork.
            TAG_NOTE=":warning: Could not update \`$TRACKING_TAG\` (push refused). Until a maintainer runs \`git push helio +$SYNC_SHA:refs/tags/$TRACKING_TAG\` (from a clone whose fork remote is \`helio\`), every run will redo this merge to reach the same conclusion."
            echo "::warning title=Tracking tag not updated::Could not force-update $TRACKING_TAG to $SYNC_SHA."
          fi

          {
            echo "### Upstream sync: nothing to do"
            echo ""
            echo "\`$SYNC_LABEL\` merges into the release branch with **no change to the tree**, so its content is already present — most likely merged by a squashed PR, which leaves no ancestry for the earlier checks to find."
            echo ""
            echo "$TAG_NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Identify Helio-relevant upstream changes
        if: steps.check.outputs.skip != 'true'
        id: helio_changes
        env:
          LAST: ${{ steps.check.outputs.last_synced }}
          LATEST: ${{ steps.target.outputs.sync_ref }}
        run: |

          # High-conflict-risk files from HELIO_INTEGRATION.md
          WATCHED_FILES=(
            "src/slic3r/GUI/Plater.cpp"
            "src/slic3r/GUI/Plater.hpp"
            "src/slic3r/GUI/MainFrame.cpp"
            "src/slic3r/GUI/MainFrame.hpp"
            "src/slic3r/GUI/GCodeViewer.cpp"
            "src/slic3r/GUI/NotificationManager.cpp"
            "src/slic3r/GUI/NotificationManager.hpp"
            "src/slic3r/GUI/PartPlate.hpp"
            "src/slic3r/GUI/PartPlate.cpp"
            "src/slic3r/GUI/GUI_App.cpp"
            "src/slic3r/GUI/GUI_App.hpp"
            "src/slic3r/GUI/Preferences.cpp"
            "src/slic3r/GUI/BackgroundSlicingProcess.hpp"
            "src/slic3r/GUI/Widgets/SwitchButton.cpp"
            "src/slic3r/GUI/Widgets/SwitchButton.hpp"
            "src/slic3r/GUI/Widgets/TextInput.cpp"
            "src/slic3r/GUI/Widgets/TextInput.hpp"
            "src/slic3r/GUI/LibVGCode/LibVGCodeWrapper.cpp"
            "src/slic3r/CMakeLists.txt"
            "src/libslic3r/AppConfig.cpp"
            "src/libslic3r/PrintBase.hpp"
            "src/libslic3r/PrintConfig.cpp"
            "src/libslic3r/GCode/GCodeProcessor.cpp"
            "src/libslic3r/GCode/GCodeProcessor.hpp"
            "src/libvgcode/include/PathVertex.hpp"
            "src/libvgcode/include/Types.hpp"
            "src/libvgcode/src/ViewerImpl.cpp"
            "src/libvgcode/src/ViewerImpl.hpp"
            "src/slic3r/GUI/GLCanvas3D.cpp"
            "src/slic3r/GUI/GLToolbar.cpp"
            "src/slic3r/GUI/GLToolbar.hpp"
            "src/slic3r/GUI/Selection.cpp"
          )

          REPORT=""
          for f in "${WATCHED_FILES[@]}"; do
            STAT=$(git diff --stat "$LAST".."$LATEST" -- "$f" 2>/dev/null | tail -1)
            if [ -n "$STAT" ] && echo "$STAT" | grep -q "changed"; then
              printf -v REPORT '%s- `%s`: %s\n' "$REPORT" "$f" "$STAT"
            fi
          done

          if [ -z "$REPORT" ]; then
            REPORT="No Helio-relevant files were modified upstream."
          fi

          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REPORT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Get upstream changelog
        if: steps.check.outputs.skip != 'true'
        id: changelog
        env:
          LAST: ${{ steps.check.outputs.last_synced }}
          LATEST: ${{ steps.target.outputs.sync_ref }}
        run: |

          LOG=$(git log --oneline "$LAST".."$LATEST" -- | head -50)
          TOTAL=$(git rev-list --count "$LAST".."$LATEST")

          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL" -gt 50 ]; then
            echo "... and $((TOTAL - 50)) more commits" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Push unmerged branch for conflict resolution
        id: push_branch
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.sync_branch.outputs.branch }}
        run: |
          git merge --abort
          LOCAL_TIP=$(git rev-parse HEAD)
          REMOTE_TIP=$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')

          # Whether the remote branch now holds *this* run's conflict state.  The
          # conflict issue tells resolvers to check the branch out, so it has to say
          # something different when we left the remote branch as it was.
          skipped() {
            echo "::warning::$1"
            {
              echo "pushed=false"
              echo "skip_reason<<EOF"
              echo "$1"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -n "$REMOTE_TIP" ]; then
            if [ "$REMOTE_TIP" = "$LOCAL_TIP" ]; then
              echo "Remote branch '$BRANCH' already at same commit — skipping push."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # An open PR means resolution work is in flight on this branch.  Check
            # this before the ancestor test below: resolvers squash their branch
            # (required by `require-squashed-sync`), which rewrites history and
            # makes LOCAL_TIP a non-ancestor even though the work is very much live.
            # `.[0].number` on an empty result prints the literal `null`, which is
            # a non-empty string — use `// empty` so "no open PR" is really empty.
            # A failed lookup must not read as "no PR": that would let the force-push
            # below clobber live resolution work, so fail the run instead.
            if ! OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
                             --state open --json number --jq '.[0].number // empty'); then
              echo "::error::Could not determine whether '$BRANCH' has an open PR. Refusing to force-push without that evidence."
              exit 1
            fi
            if [ -n "$OPEN_PR" ]; then
              skipped "Remote branch '$BRANCH' has open PR #${OPEN_PR} — resolution is in progress. Skipped the push to avoid losing that work, so the branch does not carry this run's conflict state."
            fi
            # If someone pushed conflict-resolution commits on top, don't clobber them.
            if git merge-base --is-ancestor "$LOCAL_TIP" "$REMOTE_TIP"; then
              skipped "Remote branch '$BRANCH' has commits beyond our base — someone may be resolving conflicts. Skipped the push to avoid losing that work, so the branch does not carry this run's conflict state."
            fi
            # Remote is at a stale commit from a previous run — replace it.  A
            # force push avoids deleting the branch first, which fails when branch
            # protection blocks deletion; --force-with-lease pins the replacement to
            # the tip inspected above, so a push that landed since the ls-remote is
            # never overwritten.  Neither a lost lease nor a ruleset that forbids
            # force-pushes is a sync failure — but anything else (auth, network,
            # remote outage) is, and must not be swallowed.
            PUSH_STATUS=0
            PUSH_ERR=$(git push origin "$BRANCH" --force-with-lease="$BRANCH:$REMOTE_TIP" 2>&1) || PUSH_STATUS=$?
            printf '%s\n' "$PUSH_ERR"
            if [ "$PUSH_STATUS" -ne 0 ]; then
              case "$PUSH_ERR" in
                *"stale info"*|*"fetch first"*|*"non-fast-forward"*)
                  skipped "'$BRANCH' moved after this run inspected it (${REMOTE_TIP}), so the replacement push lost its lease. The branch does not carry this run's conflict state." ;;
                *"repository rule violations"*|*"Cannot force-push"*|*"protected branch"*|*"pre-receive hook declined"*)
                  skipped "Could not force-push '$BRANCH' — blocked by a repository ruleset. The branch is still at its previous commit and does not carry this run's conflict state; delete it to let the next run recreate it, or resolve the conflict from scratch." ;;
                *)
                  echo "::error::Unexpected failure pushing '$BRANCH' (exit ${PUSH_STATUS}) — not a ruleset rejection. See the push output above."
                  exit 1 ;;
              esac
            fi
          else
            git push origin "$BRANCH"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Handle merge conflicts
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'conflict'
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ steps.sync_branch.outputs.branch }}
          SYNC_LABEL: ${{ steps.target.outputs.sync_label }}
          SYNC_SHA: ${{ steps.target.outputs.sync_sha }}
          TARGET_BRANCH: ${{ steps.branch.outputs.target }}
          HELIO_REPORT: ${{ steps.helio_changes.outputs.report }}
          GRAFTED: ${{ steps.graft.outputs.grafted }}
          GRAFT_COMMIT: ${{ steps.graft.outputs.graft_commit }}
          PREV_UPSTREAM: ${{ steps.graft.outputs.prev_upstream }}
          BRANCH_PUSHED: ${{ steps.push_branch.outputs.pushed }}
          PUSH_SKIP_REASON: ${{ steps.push_branch.outputs.skip_reason }}
        with:
          script: |
            const fs = require('fs');
            const branch = process.env.SYNC_BRANCH;
            const syncLabel = process.env.SYNC_LABEL;
            const syncSha = process.env.SYNC_SHA;
            const target = process.env.TARGET_BRANCH;
            const helioReport = process.env.HELIO_REPORT;
            const grafted = process.env.GRAFTED === 'true';
            const graftCommit = process.env.GRAFT_COMMIT || '';
            const prevUpstream = process.env.PREV_UPSTREAM || '';

            if (!branch || !syncLabel) {
              core.setFailed('Missing required env vars: SYNC_BRANCH or SYNC_LABEL');
              return;
            }

            // Read the conflict list from the file written by the merge step
            // (avoids the OS argument-size limit that a large env var would hit).
            let conflicts = '';
            try {
              conflicts = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/sync-conflicts.txt`, 'utf8').trim();
            } catch (e) {
              console.warn('Could not read sync-conflicts.txt:', e.message);
            }

            // Reproduce the CI merge-base locally: without the same graft, a
            // squash-flattened base makes the merge conflict on thousands of
            // files instead of the true upstream delta.
            const graftStep = grafted
              ? [
                  '2. Re-establish the correct merge base (matches CI — without this the',
                  '   merge conflicts on far more files), then merge:',
                  '   ```bash',
                  `   git replace --graft ${graftCommit} $(git rev-parse ${graftCommit}^@) ${prevUpstream}`,
                  `   git merge ${syncSha}`,
                  `   # ...resolve conflicts, then: git replace -d ${graftCommit}`,
                  '   ```',
                ]
              : [
                  '2. Merge the upstream target:',
                  '   ```bash',
                  `   git merge ${syncSha}`,
                  '   ```',
                ];

            // Truncate conflict list if it would push the body over
            // GitHub's 65 536-character issue-body limit.
            const conflictLines = conflicts ? conflicts.split('\n') : [];
            const MAX_BODY = 65000; // leave headroom for encoding overhead
            const MAX_CONFLICT_LINES = 200;
            let conflictBlock;
            if (conflictLines.length > MAX_CONFLICT_LINES) {
              conflictBlock = conflictLines.slice(0, MAX_CONFLICT_LINES).join('\n')
                + `\n... and ${conflictLines.length - MAX_CONFLICT_LINES} more files (${conflictLines.length} total)`;
            } else {
              conflictBlock = conflicts;
            }

            // The push step may have deliberately left the remote branch alone
            // (open PR, resolution commits on top, or a ruleset-blocked force-push).
            // Say so, otherwise step 1 sends resolvers to a branch that does not
            // hold this run's conflict state.
            const branchPushed = process.env.BRANCH_PUSHED !== 'false';
            const pushSkipReason = (process.env.PUSH_SKIP_REASON || '').trim();
            const staleBranchNote = branchPushed
              ? []
              : [
                  `> [!WARNING]`,
                  `> **CI did not update \`${branch}\`.** ${pushSkipReason}`,
                  `> Start from \`${target}\` and redo the merge rather than trusting the branch as-is.`,
                  '',
                ];
            // When the branch was not updated, checking it out would redo the merge
            // on top of stale or in-progress work — recreate it from the target
            // branch instead, so the commands match the warning above.
            const checkoutBlock = branchPushed
              ? [
                  '1. Check out the sync branch (already pushed by CI) and fetch upstream:',
                  '   ```bash',
                  `   git fetch origin && git checkout ${branch}`,
                ]
              : [
                  `1. Recreate the sync branch from \`${target}\` — do **not** build on the existing`,
                  '   remote branch, it does not carry this run\'s conflict state (see the warning above):',
                  '   ```bash',
                  `   git fetch origin`,
                  `   git checkout -B ${branch} origin/${target}`,
                ];

            let body = [
              `## Merge conflicts detected syncing ${syncLabel}`,
              '',
              ...staleBranchNote,
              `The automatic merge of upstream \`${syncLabel}\` into \`${target}\` produced conflicts in **${conflictLines.length} files**.`,
              '',
              '### Conflicted files',
              '```',
              conflictBlock,
              '```',
              '',
              '### Helio-relevant upstream changes',
              helioReport,
              '',
              '### Resolution steps',
              ...checkoutBlock,
              '   git remote add upstream https://github.com/SoftFever/OrcaSlicer.git 2>/dev/null || true',
              '   git fetch upstream --tags',
              '   ```',
              ...graftStep,
              '3. Resolve conflicts (use HELIO_INTEGRATION.md as reference):',
              '   ```bash',
              '   claude "Read HELIO_INTEGRATION.md then fix the merge conflicts. Preserve all Helio code."',
              '   ```',
              '4. Collapse the resolved merge into a SINGLE commit before pushing.',
              '   The merge carries upstream\'s hundreds of individual commits; pushing',
              '   them makes GitHub subscribe ~100+ external upstream contributors to',
              '   this fork\'s PR notifications. Squash to one internally-authored commit',
              '   (same tree, parent = target-branch tip, no upstream parents):',
              '   ```bash',
              '   git commit --no-edit                     # commit the resolved merge if not already',
              '   # (if you grafted in step 2, drop it first: git replace -d <graft-commit>)',
              '   BASE=$(git rev-parse HEAD^1)             # target-branch tip (first parent)',
              '   # (placeholders below are literal — do NOT paste the raw upstream tag into a',
              '   #  double-quoted -m; git refnames may contain $()/backticks that would run)',
              '   NEW=$(git commit-tree "HEAD^{tree}" -p "$BASE" -m "Upstream sync: <tag> into <target-branch> (squashed)")',
              '   git reset --hard "$NEW"                  # branch now has exactly one commit',
              `   git push origin ${branch} --force-with-lease`,
              '   ```',
              '5. Open a PR and squash-merge it into the release branch (a squash keeps',
              '   the "verified signatures" rule satisfied). Do NOT push unsigned',
              '   upstream commits to a protected branch.',
              '',
              'See `HELIO_INTEGRATION.md` for detailed conflict resolution rules.',
            ].join('\n');

            // Final safety: hard-truncate if still over the limit
            if (body.length > MAX_BODY) {
              const truncationNote = '\n\n---\n*Issue body truncated — full conflict list available via `git diff --name-only --diff-filter=U`*';
              const sliceLimit = Math.max(0, MAX_BODY - truncationNote.length);
              body = body.slice(0, sliceLimit) + truncationNote;
            }

            // Ensure required labels exist before creating the issue; a missing
            // label causes a 422 validation error that would suppress the issue.
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name,
                      color,
                      description
                    });
                    console.log(`Created missing label: ${name}`);
                  } catch (createError) {
                    console.warn(
                      `Warning: could not create missing label '${name}' (issue will be created without this label): `,
                      createError.message
                    );
                  }
                } else {
                  console.warn(
                    `Warning: could not verify label '${name}' (issue creation may fail): `,
                    e.message
                  );
                }
              }
            };

            await ensureLabel('upstream-sync', '0075ca', 'Upstream synchronisation tracking');
            await ensureLabel('claude-work',   'e4e669', 'Work item for Claude / Copilot');

            const title = `Upstream sync failed: ${syncLabel} (merge conflicts)`;

            // This step runs on every scheduled sync that still conflicts, so
            // without a dedupe each run opens another identical issue. Reuse the
            // open one and refresh its body instead — the conflict set (and the
            // "did CI update the branch" warning) can change between runs.
            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
              per_page: 100,
            })).data.find(i => i.title === title && !i.pull_request);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
              console.log(`Refreshed existing merge conflict issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['upstream-sync', 'claude-work'],
                body: body
              });
              console.log(`Created merge conflict issue #${created.data.number}`);
            }

      # Collapse the clean merge into a single commit BEFORE pushing. The merge
      # commit created above has upstream's full history as its second parent
      # (hundreds of commits). GitHub auto-subscribes the author of every commit
      # in a PR to that PR's notifications, so pushing the merge would spam ~100+
      # external upstream contributors with every comment on this fork's sync PR.
      # A squash keeps the exact same tree but gives the branch one commit whose
      # only parent is our target branch tip — no upstream parents, no external
      # commit authors. The PR is squash-merged anyway, so nothing is lost.
      - name: Squash clean merge into a single commit
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'clean' && steps.noop.outputs.noop != 'true'
        # Pass tag-derived values through env vars, never interpolated directly into
        # the run: body — git ref names can contain shell metacharacters (`, $, (, ))
        # that GitHub template expansion does not escape (template-injection).
        env:
          SYNC_LABEL: ${{ steps.target.outputs.sync_label }}
          SYNC_REF: ${{ steps.target.outputs.sync_ref }}
          SYNC_SHA: ${{ steps.target.outputs.sync_sha }}
          TARGET_BRANCH: ${{ steps.branch.outputs.target }}
          PRE_MERGE: ${{ steps.merge.outputs.pre_merge }}
        run: |
          BASE="$PRE_MERGE"                   # target-branch tip recorded before the merge
          TREE=$(git rev-parse "HEAD^{tree}") # resolved merge (or fast-forwarded) tree
          NEW=$(git commit-tree "$TREE" -p "$BASE" \
            -m "Upstream sync: ${SYNC_LABEL} into ${TARGET_BRANCH} (squashed)" \
            -m "Squashed single-commit sync of upstream ${SYNC_REF} (${SYNC_SHA})." \
            -m "Collapsed from the merge commit so the PR carries one internally-authored commit instead of upstream's individual commits — the latter auto-subscribes external upstream contributors to this fork's PR notifications.")
          git reset --hard "$NEW"
          echo "Squashed clean merge into single commit $NEW (parent $BASE)"

      - name: Push clean merge branch
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'clean' && steps.noop.outputs.noop != 'true'
        # Through `env`, not `${{ }}` inline. The branch name is derived from
        # LATEST_TAG — an UPSTREAM-controlled ref name — and GitHub expands
        # expressions before bash parses the line, so a crafted upstream tag
        # containing shell metacharacters would execute here. An env var is
        # substituted by the shell after parsing, so it cannot.
        env:
          SYNC_BRANCH: ${{ steps.sync_branch.outputs.branch }}
        run: |
          # force-with-lease so retries (same branch name) overwrite the previous attempt
          git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Trigger build check
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'clean' && steps.noop.outputs.noop != 'true'
        id: build
        continue-on-error: true
        uses: actions/github-script@v7
        # Same reason as the push step above: interpolating the branch name into
        # the script body makes an upstream-controlled string part of the
        # JavaScript source, where a quote would end the literal.
        env:
          SYNC_BRANCH: ${{ steps.sync_branch.outputs.branch }}
        with:
          script: |
            // Trigger full build_all workflow (all platforms) on the sync branch
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build_all.yml',
              ref: process.env.SYNC_BRANCH
            });

      - name: Create pull request
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'clean' && steps.noop.outputs.noop != 'true'
        id: pr
        uses: actions/github-script@v7
        env:
          SYNC_LABEL: ${{ steps.target.outputs.sync_label }}
          SYNC_REF: ${{ steps.target.outputs.sync_ref }}
          TARGET_BRANCH: ${{ steps.branch.outputs.target }}
          SYNC_BRANCH: ${{ steps.sync_branch.outputs.branch }}
          HELIO_REPORT: ${{ steps.helio_changes.outputs.report }}
          CHANGELOG: ${{ steps.changelog.outputs.log }}
          TOTAL_COMMITS: ${{ steps.changelog.outputs.total }}
        with:
          script: |
            const syncLabel = process.env.SYNC_LABEL;
            const syncRef = process.env.SYNC_REF;
            const target = process.env.TARGET_BRANCH;
            const branch = process.env.SYNC_BRANCH;
            const helioReport = process.env.HELIO_REPORT;
            const changelog = process.env.CHANGELOG;
            const total = process.env.TOTAL_COMMITS;

            if (!syncLabel || !target || !branch) {
              core.setFailed('Missing required env vars: SYNC_LABEL, TARGET_BRANCH, or SYNC_BRANCH');
              return;
            }

            // Ensure claude-work label exists before trying to apply it
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'claude-work'
              });
            } catch (e) {
              if (e.status === 404) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: 'claude-work',
                    color: 'e4e669',
                    description: 'Work item for Claude / Copilot'
                  });
                  console.log('Created missing label: claude-work');
                } catch (createErr) {
                  console.warn('Warning: could not create claude-work label:', createErr.message);
                }
              }
            }

            const body = [
              `## Upstream Sync: ${syncLabel}`,
              '',
              `Merges upstream \`${syncRef}\` into \`${target}\`.`,
              '',
              `### Upstream changelog (${total} commits)`,
              '```',
              changelog,
              '```',
              '',
              '### Helio-relevant upstream changes',
              helioReport,
              '',
              '### Merge status',
              '- [x] Clean merge (no conflicts)',
              '- [ ] Build check triggered',
              '',
              '### Review checklist',
              '- [ ] Verify Helio features still work (Slice with Helio button, TI visualization)',
              '- [ ] Check that all `helio_*` identifiers are preserved',
              '- [ ] Run local build on macOS: `cmake --build build/arm64 --config RelWithDebInfo --target all`',
              '',
              '---',
              '*Auto-generated by helio-upstream-sync workflow*',
            ].join('\n');

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: branch,
                base: target,
                title: `Upstream sync: ${syncLabel}`,
                body: body
              });
              core.setOutput('url', pr.html_url);
              console.log(`Created PR: ${pr.html_url}`);

              // Add claude-work label for Cowork auto-triage
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['claude-work']
                });
              } catch (labelErr) {
                console.warn(`Warning: failed to add claude-work label to PR #${pr.number}:`, labelErr);
              }
            } catch (err) {
              const errMsg = err.message || '';
              const errData = err.response?.data;
              const errMsgs = [errMsg, errData?.message || '', ...(errData?.errors || []).map(e => e?.message || '')].join(' ');

              if (err.status === 422 && errMsgs.includes('No commits between')) {
                console.log(`No diff between ${target} and ${branch} — skipping PR creation`);
              } else if (err.status === 422 && errMsgs.includes('already exists')) {
                console.log(`PR already exists for ${branch} — looking up existing PR to apply label`);
                try {
                  const { data: prs } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    head: `${context.repo.owner}:${branch}`,
                    base: target,
                    state: 'open'
                  });
                  if (prs.length > 0) {
                    const existingPr = prs[0];
                    core.setOutput('url', existingPr.html_url);
                    console.log(`Found existing PR #${existingPr.number}: ${existingPr.html_url}`);
                    try {
                      await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: existingPr.number,
                        labels: ['claude-work']
                      });
                    } catch (labelErr) {
                      console.warn(`Warning: failed to add claude-work label to existing PR #${existingPr.number}:`, labelErr);
                    }
                  } else {
                    console.log(`Could not find existing open PR for ${branch} → ${target}`);
                  }
                } catch (listErr) {
                  console.warn(`Warning: failed to list PRs for ${branch}:`, listErr);
                }
              } else {
                throw err;
              }
            }

      - name: Note pending sync
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.status == 'clean' && steps.noop.outputs.noop != 'true'
        env:
          SYNC_SHA: ${{ steps.target.outputs.sync_sha }}
          SYNC_LABEL: ${{ steps.target.outputs.sync_label }}
          TRACKING_TAG: ${{ steps.target.outputs.tracking_tag }}
          TARGET_BRANCH: ${{ steps.branch.outputs.target }}
        run: |

          # The tracking tag is deliberately NOT advanced here.
          #
          # It used to be, as soon as the sync PR was created. That made the tag a
          # record of "a PR was opened", not of "this branch holds that content" —
          # and the rest of the workflow reads it as the latter. Two silent drops
          # followed from the gap. If the PR was closed unmerged, the early exit in
          # `check` ("tracking tag equals the target") skipped that release for
          # good. And while the PR merely sat open, the tag named content the
          # branch did not have, so the next release grafted it as the merge base
          # and git read the unmerged content as deliberate reversions.
          #
          # The tag now only ever moves on evidence that the content is ON the
          # target branch: the ancestor hit, the no-diff trial merge, or the
          # merged-tree comparison in `noop`. After this PR is merged, the next
          # run takes one of those paths and advances it then. Until then the run
          # redoes the merge each week and refreshes the same PR, which is the
          # honest description of the state: not synced yet.
          {
            echo "### Sync PR open, tracking tag unchanged"
            echo
            echo "\`$TRACKING_TAG\` still points at the last commit whose content is on \`$TARGET_BRANCH\`."
            echo "It advances to \`$SYNC_SHA\` (\`$SYNC_LABEL\`) on the first run after this PR merges."
          } >> "$GITHUB_STEP_SUMMARY"
